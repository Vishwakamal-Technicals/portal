services:
  backend:
    build:
      context: ./backend
    container_name: vishwakamal-api
    environment:
      - NODE_ENV=production
      - PORT=8080
      - FRONTEND_ORIGIN=http://localhost:3000
      - EMAIL_PROVIDER=console
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: vishwakamal-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
